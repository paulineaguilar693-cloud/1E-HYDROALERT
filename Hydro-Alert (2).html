<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hydro-Alert</title>
<style>
/* ================= CSS ================= */
:root{--tx:#eef0ff;--mu:#aab0d8;--bd:rgba(255,255,255,.14);--card:rgba(20,17,62,.78);--pri:#6a5be0;--acc:#c4609f;--g:#1e9e57;--o:#f08c00;--r:#d62839;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:#0b0a2e}
a{color:inherit}
/* ---- left sidebar ---- */
#side{position:fixed;top:0;left:0;bottom:0;width:250px;display:none;flex-direction:column;background:rgba(10,8,40,.88);backdrop-filter:blur(12px);border-right:1px solid var(--bd);padding:14px 10px;z-index:20;overflow-y:auto}
body.in #side{display:flex}
body.in #content{margin-left:250px}
.sb-brand{display:flex;align-items:center;gap:10px;padding:2px 8px 16px}
.sb-brand b{font-size:18px;letter-spacing:.3px}
.logo{width:46px;height:46px;background:#fff;border-radius:12px;padding:3px;display:flex;flex:none}
.logo img{width:100%;height:100%;object-fit:contain}
.menu a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--mu);text-decoration:none;margin-bottom:3px}
.menu a:hover{background:rgba(255,255,255,.08);color:var(--tx)}
.menu a.on{background:linear-gradient(135deg,var(--pri),var(--acc));color:#fff;font-weight:600}
.menu .ic{width:22px;text-align:center}
.menu .sep{font-size:11px;letter-spacing:1px;color:var(--mu);padding:12px 12px 4px;text-transform:uppercase}
.badge{background:var(--r);color:#fff;border-radius:99px;padding:0 7px;font-size:11px;margin-left:auto}
.who{margin-top:auto;padding:12px 8px 4px;border-top:1px solid var(--bd);font-size:14px}
#top{display:none;align-items:center;gap:10px;padding:10px 14px;background:rgba(10,8,40,.9);position:sticky;top:0;z-index:15;border-bottom:1px solid var(--bd)}
#scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:18}
@media(max-width:820px){
  body.in #content{margin-left:0}
  body.in #top{display:flex}
  #side{transform:translateX(-100%);transition:transform .25s}
  body.menu #side{transform:none}
  body.menu #scrim{display:block}
}
/* ---- content ---- */
main{max-width:1000px;margin:0 auto;padding:20px 16px}
h2{margin:4px 0 12px}h3{margin:0 0 8px;font-size:15px;color:var(--mu);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:12px}
.card{background:var(--card);border:2px solid var(--bd);border-radius:14px;padding:14px;backdrop-filter:blur(8px)}
.big{font-size:30px;font-weight:700}.big small{font-size:14px;font-weight:400}
.pill{display:inline-block;padding:3px 12px;border-radius:99px;color:#fff;font-weight:600;font-size:13px}
.green{background:var(--g)}.orange{background:var(--o)}.red{background:var(--r)}.blue{background:var(--pri)}.off{background:#5b5f86}
.meter{height:10px;background:rgba(255,255,255,.15);border-radius:9px;overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;width:0;transition:.4s}
input,textarea,select{width:100%;padding:9px 10px;border:1px solid rgba(255,255,255,.22);border-radius:8px;background:rgba(255,255,255,.08);color:var(--tx);font:inherit;margin:4px 0 10px}
input::placeholder,textarea::placeholder{color:#8088b8}
option{background:#14123f;color:#fff}
input:disabled,select:disabled{opacity:.6}
input[type=range]{padding:0;accent-color:var(--acc)}input[type=checkbox]{width:auto;margin:0 6px 0 0;accent-color:var(--acc)}
label{font-size:13px;color:var(--mu)}
button{background:linear-gradient(135deg,var(--pri),var(--acc));color:#fff;border:0;border-radius:8px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer;margin:2px 4px 2px 0}
button.sec{background:transparent;color:var(--tx);border:1px solid rgba(255,255,255,.25)}
button.red{background:var(--r)}button.orange{background:var(--o)}
.item{border:1px solid var(--bd);border-left:4px solid var(--bd);padding:8px 12px;margin-bottom:8px;background:var(--card);border-radius:0 10px 10px 0}
.item.orange{border-left-color:var(--o)}.item.red{border-left-color:var(--r)}.item.green{border-left-color:var(--g)}.item.suspension{border-left-color:var(--acc)}
.item.unread{font-weight:600}
.mu{color:var(--mu);font-size:13px}
.table{overflow-x:auto;margin-bottom:14px}table{width:100%;border-collapse:collapse;min-width:560px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd);font-size:14px}th{color:var(--mu);font-weight:600}
.login{max-width:380px;margin:5vh auto}.login .card{text-align:left}.login p{text-align:center}
.logoBig{background:#fff;border-radius:22px;width:210px;margin:0 auto 14px;padding:8px;box-shadow:0 8px 30px rgba(0,0,0,.4)}.logoBig img{width:100%;display:block}
.err{color:#ff7a88;font-size:13px;min-height:18px}
#ov{position:fixed;inset:0;z-index:99;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;padding:24px;animation:fl 1s infinite alternate}
#ov.orange{background:#f08c00}#ov.red{background:#d62839}
#ov h1{font-size:clamp(32px,8vw,64px);margin:0 0 12px}#ov p{font-size:18px;max-width:560px}
#ov button{background:#fff;color:#14202e;font-size:18px;padding:14px 26px}
@keyframes fl{from{filter:brightness(1)}to{filter:brightness(1.25)}}

</style>
</head>
<body>
<!-- ================= HTML ================= -->
<aside id="side"></aside>      <!-- left menu (filled by the script) -->
<div id="scrim"></div>         <!-- dark layer behind the menu on phones -->
<div id="content">
  <div id="top"><button class="sec" id="mb">☰</button><b>Hydro-Alert</b></div>   <!-- phone menu button -->
  <main id="app"></main>       <!-- pages appear here -->
</div>
<div id="ov"></div>            <!-- full-screen alert -->

<script>
// ================= JAVASCRIPT =================
/* Hydro-Alert - all the logic in one file.
   Data is saved in the browser (localStorage). Rainfall is simulated with a slider. */
const $ = id => document.getElementById(id);
const ld = (k, d) => { try { const v = localStorage.getItem('ha_' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
const sv = (k, v) => { try { localStorage.setItem('ha_' + k, JSON.stringify(v)); } catch (e) {} };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const now = () => new Date().toLocaleString();
let LOGO_FULL = '', LOGO_ICON = '';   // filled from IMG (the embedded images at the very end of this file)

// ---------- accounts ----------
const ADMIN = 'School Administrator';
const SELF_ROLES = ['Student', 'Parent/Guardian', 'Teacher'];
const LEVELS = ['Elementary', 'Junior High', 'Senior High', 'College'];
const USERS = {   // demo accounts (new users can also register on the login page)
  'admin@hydroalert.ph':   { pw: 'admin123',   name: 'Maria Santos', role: ADMIN,             org: 'Central College',       level: 'All',     section: '' },
  'teacher@hydroalert.ph': { pw: 'teacher123', name: 'Ana Lopez',    role: 'Teacher',         org: 'Central College',       level: 'College', section: 'BSIT 1-E' },
  'student@hydroalert.ph': { pw: 'student123', name: 'Pedro Reyes',  role: 'Student',         org: 'Central College',       level: 'College', section: 'BSIT 1-E' },
  'parent@hydroalert.ph':  { pw: 'parent123',  name: 'Rosa Reyes',   role: 'Parent/Guardian', org: 'Parent of Pedro Reyes', level: 'College', section: 'BSIT 1-E' }
};
const ACC = () => ({ ...USERS, ...ld('accounts', {}) });
const acct = e => ACC()[e] ? { ...ACC()[e], ...(ld('profiles', {})[e] || {}), email: e } : null;
const LBL = { green: 'Normal', orange: 'Orange - Warning', red: 'Red - Critical Warning' };
const COL = { green: 'var(--g)', orange: 'var(--o)', red: 'var(--r)' };
const PAGES = { dashboard: ['🏠', 'Dashboard'], alerts: ['🚨', 'Alert Center'], notifications: ['🔔', 'Notifications'], announcements: ['📢', 'Announcements'], history: ['🕘', 'History'], profile: ['👤', 'Profile'], users: ['🛡️', 'Users & Logins'] };

// ---------- app state ----------
const S = {
  user: ld('user', null), sound: ld('sound', true), auto: false,
  w: ld('w', { rain: 2, temp: 29, hum: 70, wind: 12, level: 'green' }),
  hist: ld('hist', []), notifs: ld('notifs', []), anns: ld('anns', [])
};
if (S.user && !ACC()[S.user]) { S.user = null; sv('user', null); }
let page = 'dashboard', histFilter = 'all', reg = false;
const me = () => acct(S.user);
const isAdmin = () => !!me() && me().role === ADMIN;
const route = () => (page === 'users' && !isAdmin()) ? 'dashboard' : (PAGES[page] ? page : 'dashboard');   // only admins may open "users"
const activeSusp = () => S.anns.find(a => a.active);
const levelOf = r => r >= 30 ? 'red' : r >= 15 ? 'orange' : 'green';      // mm/hr
const affects = a => !a.levels || a.levels.includes('All') || me().level === 'All' || a.levels.includes(me().level);
function addNotif(type, text, level) { S.notifs.unshift({ type, text, level: level || '', time: now(), read: false }); S.notifs = S.notifs.slice(0, 100); sv('notifs', S.notifs); }
function addHist(type, level, note) { S.hist.unshift({ time: now(), type, level, rain: S.w.rain.toFixed(1), note }); S.hist = S.hist.slice(0, 200); sv('hist', S.hist); }
const nItem = n => `<div class="item ${n.level || n.type} ${n.read ? '' : 'unread'}">${esc(n.text)}<div class="mu">${esc(n.type.toUpperCase())} · ${esc(n.time)}</div></div>`;
const typing = () => { const a = document.activeElement; return a && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && a.type !== 'range'; };

// ---------- who logs in (admin can view this on the Users & Logins page) ----------
function track(email, ev) {
  const logins = ld('logins', []), stats = ld('stats', {}), act = ld('act', {}), u = acct(email);
  logins.unshift({ t: Date.now(), email, name: u.name, role: u.role, ev });
  if (ev === 'login') { const s = stats[email] || { count: 0 }; s.count++; s.last = Date.now(); stats[email] = s; act[email] = Date.now(); } else act[email] = 0;
  sv('logins', logins.slice(0, 300)); sv('stats', stats); sv('act', act);
}
function beat() { if (!S.user) return; const a = ld('act', {}); a[S.user] = Date.now(); sv('act', a); }   // "I'm still online"

// ---------- alarm sound, voice, full-screen alert ----------
let ac, osc, sirT;
function siren(on, level) {
  try {
    clearInterval(sirT); if (osc) { osc.stop(); osc = null; }
    if (!on || !S.sound) return;
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    osc = ac.createOscillator(); const g = ac.createGain(); g.gain.value = .3;
    osc.type = 'square'; osc.connect(g); g.connect(ac.destination); osc.start();
    let hi = false; sirT = setInterval(() => { hi = !hi; osc.frequency.value = hi ? 950 : 600; }, level === 'red' ? 300 : 650);
  } catch (e) {}
}
function speak(t) { try { if (S.sound) { speechSynthesis.cancel(); speechSynthesis.speak(new SpeechSynthesisUtterance(t)); } } catch (e) {} }
function stopAlarm() { siren(false); try { speechSynthesis.cancel(); } catch (e) {} $('ov').style.display = 'none'; }
function showOverlay(level, msg) {
  if (!S.user) return;
  const o = $('ov'); o.className = level; o.style.display = 'flex';
  o.innerHTML = `<div style="font-size:70px">${level === 'red' ? '🚨' : '⚠️'}</div><h1>${level === 'red' ? 'RED ALERT' : 'ORANGE ALERT'}</h1><p>${esc(msg)}</p><button id="ack">I Understand</button>`;
  $('ack').onclick = stopAlarm; siren(true, level); speak(msg);
}

// ---------- weather engine ----------
function setRain(r) {
  const w = S.w; w.rain = Math.max(0, Math.min(70, r));
  const nl = levelOf(w.rain);
  if (nl !== w.level) {
    const prev = w.level; w.level = nl;
    const msg = nl === 'green' ? 'Rainfall is back to normal levels.' : `${LBL[nl]}: rainfall at ${w.rain.toFixed(1)} mm/hr. Prepare for possible class suspension.`;
    addNotif('alert', msg, nl); addHist('alert', nl, `Changed from ${prev} to ${nl}`);
    if (nl === 'green') stopAlarm(); else showOverlay(nl, msg);
    if (!typing()) render(); else sideHtml();
  }
  sv('w', w); paint();
}
setInterval(() => {
  if (!S.user) return;
  const w = S.w;
  w.temp += (Math.random() - .5) * .4;
  w.hum = Math.max(50, Math.min(99, w.hum + (w.rain > 10 ? .8 : -.4)));
  w.wind = Math.max(3, Math.min(60, w.wind + (Math.random() - .4) * 2));
  beat();
  if (S.auto) setRain(w.rain + (Math.random() - .42) * 5); else { sv('w', w); paint(); }
  if (route() === 'users' && !typing()) render();   // keep the online list fresh
}, 3000);
function paint() {
  const w = S.w, set = (i, v) => { const e = $(i); if (e) e.innerHTML = v; };
  set('rainV', w.rain.toFixed(1) + ' <small>mm/hr</small>'); set('temp', w.temp.toFixed(1) + '°C');
  set('hum', Math.round(w.hum) + '%'); set('wind', Math.round(w.wind) + ' km/h'); set('simV', w.rain.toFixed(1));
  const m = $('meter'); if (m) { m.style.width = Math.min(100, w.rain / 60 * 100) + '%'; m.style.background = COL[w.level]; }
  const l = $('lvl'); if (l) { l.className = 'pill ' + w.level; l.textContent = LBL[w.level]; }
  const sl = $('sim'); if (sl && document.activeElement !== sl) sl.value = w.rain;
  const s = activeSusp();
  set('susp', s ? (affects(s) ? '<span class="pill red">CLASSES SUSPENDED</span>' : '<span class="pill green">Not affected</span>') + `<div class="mu" style="margin-top:6px"><b>${esc(s.title)}</b><br>${esc(s.scope)}<br>${esc(s.by)}</div>` : '<span class="pill green">Classes as scheduled</span>');
}

// ---------- left sidebar ----------
function sideHtml() {
  const u = me(), un = S.notifs.filter(n => !n.read).length, cur = route();
  const link = k => `<a href="#" data-p="${k}" class="${k === cur ? 'on' : ''}"><span class="ic">${PAGES[k][0]}</span>${PAGES[k][1].replace('&', '&amp;')}${k === 'notifications' && un ? `<span class="badge">${un}</span>` : ''}</a>`;
  const main = Object.keys(PAGES).filter(k => k !== 'users').map(link).join('');
  $('side').innerHTML = `<div class="sb-brand"><span class="logo"><img src="${LOGO_ICON}" alt="Hydro-Alert logo"></span><b>Hydro-Alert</b></div>
    <div class="menu">${main}${isAdmin() ? '<div class="sep">Admin only</div>' + link('users') : ''}</div>
    <div class="who"><b>${esc(u.name)}</b><div class="mu">${esc(u.role)}</div><button class="sec" id="lo" style="margin-top:8px;width:100%">Logout</button></div>`;
  document.body.classList.add('in');
}

// ---------- pages ----------
function authView() {
  const opts = a => a.map(x => `<option>${x}</option>`).join('');
  const extra = reg ? `<label>Full name</label><input id="rn" autocomplete="name"><label>I am a</label><select id="rr">${opts(SELF_ROLES)}</select>
    <label>Education level (for a parent: your child's level)</label><select id="rl">${opts(LEVELS)}</select><label>Section / grade (optional)</label><input id="rs" placeholder="e.g. BSIT 1-E">` : '';
  return `<div class="login"><div class="logoBig"><img src="${LOGO_FULL}" alt="Hydro Alert logo"></div>
  <p class="mu">Centralized Class Suspension Announcements &amp; Weather Alerts</p>
  <div class="card">${extra}<label>${reg ? 'Email' : 'Email or username'}</label><input id="u" autocomplete="username" placeholder="student@hydroalert.ph"><label>Password</label><input id="p" type="password" autocomplete="${reg ? 'new-password' : 'current-password'}">
  <div class="err" id="err"></div><button id="lb" style="width:100%">${reg ? 'Create account' : 'Login'}</button>
  <p class="mu" style="margin:10px 0 0"><a href="#" id="sw">${reg ? 'I already have an account' : 'Create an account'}</a></p></div>
  ${reg ? '' : '<p class="mu">Demo accounts:<br>School Administrator: admin@hydroalert.ph / admin123<br>Teacher: teacher@hydroalert.ph / teacher123<br>Student: student@hydroalert.ph / student123<br>Parent/Guardian: parent@hydroalert.ph / parent123</p>'}
  <div class="card" style="margin-top:12px"><h3>Why Hydro-Alert?</h3><p class="mu" style="margin:0;text-align:left">Students and parents often rely on Facebook, group chats and word of mouth to learn if classes are suspended in bad weather, so announcements can be delayed or unclear. Hydro-Alert puts weather alerts and official suspension notices in one place for students, parents, teachers and school administrators.</p></div></div>`;
}
const simCard = () => `<div class="card"><h3>Rainfall Simulator (stands in for a live sensor)</h3><label>Rainfall: <b id="simV"></b> mm/hr (Orange ≥ 15, Red ≥ 30)</label>
  <input type="range" id="sim" min="0" max="60" step="0.5"><label><input type="checkbox" id="auto" ${S.auto ? 'checked' : ''}>Auto-simulate changing weather</label></div>`;
function dashView() {
  const u = me();
  return `<h2>Dashboard</h2><p class="mu">Welcome, ${esc(u.name)} (${esc(u.role)}${u.level !== 'All' ? ' · ' + esc(u.level) + (u.section ? ' ' + esc(u.section) : '') : ''})</p>
  <div class="grid"><div class="card"><h3>Current Weather</h3><div class="big" id="temp"></div><div class="mu">Humidity <b id="hum"></b> · Wind <b id="wind"></b></div></div>
  <div class="card"><h3>Rainfall Level</h3><div class="big" id="rainV"></div><div class="meter"><i id="meter"></i></div></div>
  <div class="card"><h3>Current Alert Status</h3><span id="lvl"></span></div>
  <div class="card"><h3>Class Suspension Status (for you)</h3><div id="susp"></div></div></div>${simCard()}
  <h3 style="margin-top:16px">Recent Notifications</h3>${S.notifs.slice(0, 4).map(nItem).join('') || '<p class="mu">No notifications yet.</p>'}`;
}
function alertsView() {
  const card = (k, t, d) => `<div class="card" style="border-color:${S.w.level === k ? COL[k] : 'var(--bd)'}"><span class="pill ${k}">${t}</span><p class="mu">${d}</p>${S.w.level === k ? '<b>● Current status</b>' : ''}</div>`;
  return `<h2>Alert Center</h2><div class="grid">${card('green', 'Green: Normal', 'Below 15 mm/hr. Normal classes.')}${card('orange', 'Orange: Warning', '15-29.9 mm/hr. Heavy rain. Be ready for suspension.')}${card('red', 'Red: Critical Warning', '30 mm/hr or more. Torrential rain. Stay home.')}</div>
  <div class="card" style="margin-bottom:12px"><h3>Alarm Sound &amp; Full-Screen Alert</h3><label><input type="checkbox" id="snd" ${S.sound ? 'checked' : ''}>Enable alarm sound and voice advisory</label><br>
  <button class="orange" id="t1">Test Orange Alert</button><button class="red" id="t2">Test Red Alert</button><button class="sec" id="t3">Stop Alarm</button></div>${simCard()}`;
}
const notifView = () => `<h2>Notifications</h2><button class="sec" id="mr">Mark all as read</button><button class="sec" id="cn">Clear all</button><div style="margin-top:10px">${S.notifs.map(nItem).join('') || '<p class="mu">No notifications yet.</p>'}</div>`;
function annView() {
  const lv = S.w.level;
  const form = isAdmin() ? `<div class="card" style="margin-bottom:14px"><h3>Approve &amp; Announce Suspension (${esc(me().role)})</h3>
    <label>Announcement title</label><input id="at" value="${lv === 'green' ? '' : 'Class suspension due to ' + (lv === 'red' ? 'critical' : 'heavy') + ' rainfall'}">
    <label>Affected levels</label><div id="lv" style="margin:4px 0 10px"><label><input type="checkbox" value="All"> All levels</label>&nbsp;${LEVELS.map(l => `<label><input type="checkbox" value="${l}"> ${l}</label>&nbsp;`).join('')}</div>
    <label>Affected sections / details (optional)</label><input id="ad" placeholder="e.g. All sections, including evening classes">
    <label>Reason for suspension</label><textarea id="ar" rows="2">${lv === 'green' ? '' : esc(LBL[lv] + ' - rainfall at ' + S.w.rain.toFixed(1) + ' mm/hr')}</textarea>
    <div class="err" id="aerr"></div><button id="ap">✔ Approve &amp; Announce</button>${activeSusp() ? '<button class="sec" id="lift">Lift Active Suspension</button>' : ''}</div>`
    : '<p class="mu">Only the School Administrator can issue official announcements. Log in as the administrator to try it. Everyone else sees the same official notice here.</p>';
  return `<h2>Suspension Announcements</h2>${form}` + (S.anns.map(a => `<div class="item suspension"><b>${esc(a.title)}</b> ${a.active ? '<span class="pill blue">ACTIVE</span>' : '<span class="pill off">LIFTED</span>'}${a.active && !affects(a) ? ' <span class="mu">(not for your level)</span>' : ''}<div>Affected: ${esc(a.scope)}</div><div>Reason: ${esc(a.reason)}</div><div class="mu">${esc(a.time)} · Official: ${esc(a.by)}</div></div>`).join('') || '<p class="mu">No announcements yet.</p>');
}
function histView() {
  const rows = S.hist.filter(h => histFilter === 'all' || h.level === histFilter || h.type === histFilter);
  const opt = (v, t) => `<option value="${v}" ${histFilter === v ? 'selected' : ''}>${t}</option>`;
  return `<h2>Alert History</h2><select id="hf" style="max-width:220px">${opt('all', 'All records')}${opt('green', 'Green')}${opt('orange', 'Orange')}${opt('red', 'Red')}${opt('announcement', 'Announcements')}</select> <button class="sec" id="ch">Clear history</button>
  <div class="table card"><table><thead><tr><th>Date &amp; Time</th><th>Type</th><th>Level</th><th>Rain (mm/hr)</th><th>Details</th></tr></thead><tbody>${rows.map(h => `<tr><td>${esc(h.time)}</td><td>${esc(h.type)}</td><td><span class="pill ${esc(h.level)}">${esc(h.level)}</span></td><td>${esc(h.rain)}</td><td>${esc(h.note)}</td></tr>`).join('') || '<tr><td colspan="5" class="mu">No records.</td></tr>'}</tbody></table></div>`;
}
function profView() {
  const u = me();
  return `<h2>User Profile</h2><div class="card" style="max-width:420px"><label>Full name</label><input id="pn" value="${esc(u.name)}"><label>Email (read-only)</label><input value="${esc(u.email)}" disabled><label>Role</label><input value="${esc(u.role)}" disabled>
  <label>School / organization</label><input id="po" value="${esc(u.org)}"><label>Education level (for a parent: your child's level)</label>
  <select id="pl" ${isAdmin() ? 'disabled' : ''}>${['All', ...LEVELS].filter(l => isAdmin() || l !== 'All').map(l => `<option ${l === u.level ? 'selected' : ''}>${l}</option>`).join('')}</select>
  <label>Section / grade (optional)</label><input id="psec" value="${esc(u.section)}"><label>New password (optional)</label><input id="pp" type="password">
  <div class="err" id="perr"></div><button id="ps">Save changes</button></div>`;
}
function usersView() {   // ADMIN ONLY
  const A = ACC(), P = ld('profiles', {}), stats = ld('stats', {}), act = ld('act', {}), logins = ld('logins', []);
  const on = e => Date.now() - (act[e] || 0) < 20000, emails = Object.keys(A);
  const today = new Date().toDateString();
  const rows = emails.map(e => { const u = { ...A[e], ...(P[e] || {}) }, s = stats[e];
    return `<tr><td>${esc(u.name)}</td><td>${esc(u.role)}</td><td>${esc(e)}</td><td>${esc(u.level === 'All' ? 'All levels' : u.level + (u.section ? ' · ' + u.section : ''))}</td><td>${on(e) ? '<span class="pill green">Online</span>' : '<span class="pill off">Offline</span>'}</td><td>${s ? esc(new Date(s.last).toLocaleString()) : 'Never'}</td><td>${s ? s.count : 0}</td></tr>`; }).join('');
  const log = logins.slice(0, 50).map(l => `<tr><td>${esc(new Date(l.t).toLocaleString())}</td><td>${esc(l.name)}</td><td>${esc(l.role)}</td><td>${esc(l.email)}</td><td>${l.ev === 'login' ? '<span class="pill green">Logged in</span>' : '<span class="pill off">Logged out</span>'}</td></tr>`).join('');
  return `<h2>Users &amp; Logins</h2><p class="mu">Only administrators can see this page. It lists who has logged in to Hydro-Alert on this browser.</p>
  <div class="grid"><div class="card"><h3>Registered users</h3><div class="big">${emails.length}</div></div>
  <div class="card"><h3>Online now</h3><div class="big">${emails.filter(on).length}</div></div>
  <div class="card"><h3>Logins today</h3><div class="big">${logins.filter(l => l.ev === 'login' && new Date(l.t).toDateString() === today).length}</div></div></div>
  <h3>Accounts</h3><div class="table card"><table><thead><tr><th>Name</th><th>Role</th><th>Email</th><th>Level / section</th><th>Status</th><th>Last login</th><th>Logins</th></tr></thead><tbody>${rows}</tbody></table></div>
  <h3>Login activity (latest 50)</h3><div class="table card"><table><thead><tr><th>Date &amp; time</th><th>Name</th><th>Role</th><th>Email</th><th>Event</th></tr></thead><tbody>${log || '<tr><td colspan="5" class="mu">No logins recorded yet.</td></tr>'}</tbody></table></div>`;
}

// ---------- show the right page and connect the buttons ----------
function render() {
  if (!S.user) { document.body.classList.remove('in', 'menu'); $('app').innerHTML = authView(); return bindLogin(); }
  sideHtml();
  const r = route();
  $('app').innerHTML = { dashboard: dashView, alerts: alertsView, notifications: notifView, announcements: annView, history: histView, profile: profView, users: usersView }[r]();
  paint(); bind(r);
}
function enter(k) {
  S.user = k; sv('user', k); page = 'dashboard'; track(k, 'login');
  try { new (window.AudioContext || window.webkitAudioContext)().resume(); } catch (e) {}   // allow sound after this click
  render();
  if (S.w.level !== 'green') showOverlay(S.w.level, `${LBL[S.w.level]} is active. Rainfall ${S.w.rain.toFixed(1)} mm/hr.`);
}
function logout() { track(S.user, 'logout'); stopAlarm(); S.user = null; sv('user', null); page = 'dashboard'; render(); }
function bindLogin() {
  $('sw').onclick = e => { e.preventDefault(); reg = !reg; render(); };
  const fail = m => { $('err').textContent = m; };
  const go = () => {
    const u = $('u').value.trim().toLowerCase(), p = $('p').value;
    if (reg) {
      const name = $('rn').value.trim();
      if (!name) return fail('Please enter your name.');
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(u)) return fail('Enter a valid email address.');
      if (p.length < 6) return fail('Password must be at least 6 characters.');
      if (ACC()[u]) return fail('That email is already registered.');
      const accs = ld('accounts', {}); accs[u] = { pw: p, name, role: $('rr').value, org: '', level: $('rl').value, section: $('rs').value.trim() };
      sv('accounts', accs); reg = false; return enter(u);
    }
    const A = ACC(), k = Object.keys(A).find(e => e === u || e.split('@')[0] === u);
    const pw = k && ((ld('profiles', {})[k] || {}).pw || A[k].pw);
    if (!k || p !== pw) return fail('Invalid email/username or password.');
    enter(k);
  };
  $('lb').onclick = go; $('p').onkeydown = e => { if (e.key === 'Enter') go(); };
}
function bind(r) {
  const sl = $('sim'); if (sl) sl.oninput = () => setRain(parseFloat(sl.value));
  const au = $('auto'); if (au) au.onchange = () => { S.auto = au.checked; };
  if (r === 'alerts') {
    $('snd').onchange = e => { S.sound = e.target.checked; sv('sound', S.sound); if (!S.sound) siren(false); };
    $('t1').onclick = () => showOverlay('orange', 'TEST: Orange Alert. Heavy rainfall warning.');
    $('t2').onclick = () => showOverlay('red', 'TEST: Red Alert. Critical rainfall. Stay indoors.');
    $('t3').onclick = stopAlarm;
  }
  if (r === 'notifications') {
    $('mr').onclick = () => { S.notifs.forEach(n => n.read = true); sv('notifs', S.notifs); render(); };
    $('cn').onclick = () => { S.notifs = []; sv('notifs', []); render(); };
    setTimeout(() => { if (route() === 'notifications' && S.user) { S.notifs.forEach(n => n.read = true); sv('notifs', S.notifs); sideHtml(); } }, 1500);
  }
  if (r === 'announcements' && isAdmin()) {
    $('ap').onclick = () => {
      const t = $('at').value.trim(), re = $('ar').value.trim(), det = $('ad').value.trim();
      const levels = [...document.querySelectorAll('#lv input')].filter(b => b.checked).map(b => b.value);
      if (!t || !re || !levels.length) { $('aerr').textContent = 'Please add a title, a reason, and at least one affected level.'; return; }
      const sc = (levels.includes('All') ? 'All levels' : levels.join(', ')) + (det ? ' - ' + det : '');
      const u = me(); S.anns.forEach(a => a.active = false);
      S.anns.unshift({ title: t, scope: sc, levels, reason: re, time: now(), by: `${u.name}, ${u.role}`, active: true }); sv('anns', S.anns);
      addNotif('suspension', `OFFICIAL: ${t}. Affected: ${sc}. Reason: ${re}`, ''); addHist('announcement', S.w.level, `${t} (${u.role})`);
      speak(`Official suspension announcement: ${t}. Affected: ${sc}.`); render();
    };
    const l = $('lift'); if (l) l.onclick = () => {
      S.anns.forEach(a => a.active = false); sv('anns', S.anns);
      addNotif('suspension', 'OFFICIAL: Suspension has been lifted. Classes resume as scheduled.', ''); addHist('announcement', S.w.level, 'Suspension lifted'); render();
    };
  }
  if (r === 'history') {
    $('hf').onchange = e => { histFilter = e.target.value; render(); };
    $('ch').onclick = () => { S.hist = []; sv('hist', []); render(); };
  }
  if (r === 'profile') $('ps').onclick = () => {
    const n = $('pn').value.trim(), p = $('pp').value; $('perr').style.color = '#ff7a88';
    if (!n) { $('perr').textContent = 'Name is required.'; return; }
    if (p && p.length < 6) { $('perr').textContent = 'Password must be at least 6 characters.'; return; }
    const P = ld('profiles', {}), pr = P[S.user] || {}; pr.name = n; pr.org = $('po').value.trim(); pr.section = $('psec').value.trim();
    if (!isAdmin()) pr.level = $('pl').value; if (p) pr.pw = p;
    P[S.user] = pr; sv('profiles', P);
    $('pp').value = ''; $('perr').style.color = '#5fe08f'; $('perr').textContent = 'Profile saved!'; sideHtml();
  };
}
// menu clicks (left sidebar): switch page without relying on the address bar
$('side').onclick = e => {
  if (!S.user) return;
  if (e.target.closest && e.target.closest('#lo')) { logout(); return; }
  const a = e.target.closest && e.target.closest('a[data-p]');
  if (a) { e.preventDefault(); page = a.dataset.p; document.body.classList.remove('menu'); render(); try { window.scrollTo(0, 0); } catch (x) {} }
};
$('mb').onclick = () => document.body.classList.toggle('menu');
$('scrim').onclick = () => document.body.classList.remove('menu');
document.addEventListener('click', () => { if (ac && ac.state === 'suspended') ac.resume(); });
function start() {
  LOGO_FULL = IMG.full; LOGO_ICON = IMG.icon;
  document.body.style.background = `linear-gradient(135deg,rgba(11,10,46,.80),rgba(60,30,100,.50) 60%,rgba(196,96,159,.25)),url(${IMG.bg}) center/cover fixed #0b0a2e`;
  beat(); render();
}
window.addEventListener('load', start);   // runs after the images block at the end of the file is ready
